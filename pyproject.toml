[project]
name = "bleep-demo-app"
version = "0.1.0"
description = "A small web app with switchable faults, made for demoing Bleep"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
